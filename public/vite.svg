<svg
  xmlns="http://www.w3.org/2000/svg"
  width="256"
  height="256"
  viewBox="0 0 256 256"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">cdx icon</title>
  <desc id="desc">Rounded square icon with the cdx wordmark.</desc>
  <defs>
    <linearGradient id="bg" x1="32" y1="24" x2="224" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff8ef" />
      <stop offset="1" stop-color="#e7d7c3" />
    </linearGradient>
    <linearGradient id="ink" x1="72" y1="64" x2="188" y2="188" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c56e3a" />
      <stop offset="1" stop-color="#6d3420" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#6d3420" flood-opacity="0.16" />
    </filter>
  </defs>

  <rect x="20" y="20" width="216" height="216" rx="52" fill="url(#bg)" />
  <rect x="20" y="20" width="216" height="216" rx="52" fill="none" stroke="#ffffff" stroke-opacity="0.65" />
  <circle cx="196" cy="64" r="18" fill="#fffaf4" fill-opacity="0.9" />
  <path d="M60 176c24 18 88 24 138-8" fill="none" stroke="#c56e3a" stroke-opacity="0.22" stroke-width="10" stroke-linecap="round" />
  <text
    x="128"
    y="146"
    text-anchor="middle"
    fill="url(#ink)"
    font-family="Fraunces, Georgia, serif"
    font-size="90"
    font-weight="700"
    letter-spacing="-9"
    filter="url(#shadow)"
  >
    cdx
  </text>
  <rect x="86" y="166" width="84" height="8" rx="4" fill="#8d4823" fill-opacity="0.28" />
</svg>
