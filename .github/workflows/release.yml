name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Guard release conditions
        id: guard
        env:
          ACTOR: ${{ github.actor }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "$ACTOR" = "github-actions[bot]" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$COMMIT_MESSAGE" in
            chore:\ release\ v*|*"[skip release]"*)
              echo "skip=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Guard stale main runs
        if: steps.guard.outputs.skip != 'true'
        id: stale_main_guard
        run: |
          git fetch origin main --depth=1
          LATEST_MAIN_SHA=$(git rev-parse origin/main)
          if [ "$GITHUB_SHA" != "$LATEST_MAIN_SHA" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skip stale release run (event SHA: $GITHUB_SHA, latest main: $LATEST_MAIN_SHA)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.guard.outputs.skip != 'true' && steps.stale_main_guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Configure git author
        if: steps.guard.outputs.skip != 'true' && steps.stale_main_guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true' && steps.stale_main_guard.outputs.skip != 'true'
        run: npm ci

      - name: Bump patch version
        if: steps.guard.outputs.skip != 'true' && steps.stale_main_guard.outputs.skip != 'true'
        id: version
        run: |
          npm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Typecheck
        if: steps.guard.outputs.skip != 'true' && steps.stale_main_guard.outputs.skip != 'true'
        run: npm run typecheck

      - name: Build
        if: steps.guard.outputs.skip != 'true' && steps.stale_main_guard.outputs.skip != 'true'
        run: npm run build

      - name: Materialize release notes
        if: steps.guard.outputs.skip != 'true' && steps.stale_main_guard.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/release-notes.mjs materialize "$VERSION"

      - name: Guard stale runs before publish
        if: steps.guard.outputs.skip != 'true' && steps.stale_main_guard.outputs.skip != 'true'
        id: prepublish_stale_guard
        run: |
          git fetch origin main --depth=1
          LATEST_MAIN_SHA=$(git rev-parse origin/main)
          if [ "$GITHUB_SHA" != "$LATEST_MAIN_SHA" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skip publish on stale run (event SHA: $GITHUB_SHA, latest main: $LATEST_MAIN_SHA)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.guard.outputs.skip != 'true' && steps.stale_main_guard.outputs.skip != 'true' && steps.prepublish_stale_guard.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Commit release metadata
        if: steps.guard.outputs.skip != 'true' && steps.stale_main_guard.outputs.skip != 'true' && steps.prepublish_stale_guard.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git add package.json package-lock.json release-notes
          git commit -m "chore: release v$VERSION [skip ci]"
          git tag "v$VERSION"

      - name: Push release commit and tag
        if: steps.guard.outputs.skip != 'true' && steps.stale_main_guard.outputs.skip != 'true' && steps.prepublish_stale_guard.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git push origin HEAD:main
          git push origin "v$VERSION"

      - name: Package release assets
        if: steps.guard.outputs.skip != 'true' && steps.stale_main_guard.outputs.skip != 'true' && steps.prepublish_stale_guard.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          cp -R dist release/dist
          cp -R dist-cli release/dist-cli
          cp package.json package-lock.json README.md release/
          tar -czf "cdx-v$VERSION-linux.tar.gz" -C release .
          zip -r "cdx-v$VERSION-linux.zip" release

      - name: Publish GitHub release
        if: steps.guard.outputs.skip != 'true' && steps.stale_main_guard.outputs.skip != 'true' && steps.prepublish_stale_guard.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          body_path: release-notes/v${{ steps.version.outputs.version }}.md
          files: |
            cdx-v${{ steps.version.outputs.version }}-linux.tar.gz
            cdx-v${{ steps.version.outputs.version }}-linux.zip
