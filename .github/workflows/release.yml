name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip release commit pushes
        id: guard
        env:
          ACTOR: ${{ github.actor }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "$ACTOR" = "github-actions[bot]" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$COMMIT_MESSAGE" in
            chore:\ release\ v*)
              echo "skip=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Setup Node.js
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Configure git author
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: npm ci

      - name: Bump patch version
        if: steps.guard.outputs.skip != 'true'
        id: version
        run: |
          npm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Typecheck
        if: steps.guard.outputs.skip != 'true'
        run: npm run typecheck

      - name: Build
        if: steps.guard.outputs.skip != 'true'
        run: npm run build

      - name: Publish to npm
        if: steps.guard.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Commit release metadata
        if: steps.guard.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git add package.json package-lock.json
          git commit -m "chore: release v$VERSION [skip ci]"
          git tag "v$VERSION"

      - name: Push release commit and tag
        if: steps.guard.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git push origin HEAD:main
          git push origin "v$VERSION"

      - name: Package release assets
        if: steps.guard.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          cp -R dist release/dist
          cp -R dist-cli release/dist-cli
          cp package.json package-lock.json README.md release/
          tar -czf "cdx-v$VERSION-linux.tar.gz" -C release .
          zip -r "cdx-v$VERSION-linux.zip" release

      - name: Publish GitHub release
        if: steps.guard.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: |
            cdx-v${{ steps.version.outputs.version }}-linux.tar.gz
            cdx-v${{ steps.version.outputs.version }}-linux.zip
